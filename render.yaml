# Demo deployment on Render (free plan sleeps after ~15 min idle).
# Database lives on Neon; set DATABASE_URL and CORS_ORIGIN in the Render dashboard.
services:
  - type: web
    name: dreamway-operation-be
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
